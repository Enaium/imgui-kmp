name: Test

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Builds and tests each platform on the runner that can build it. Each matrix
# entry covers the artifacts that its runner can build:
#
#   macOS ARM64    -> :imgui-kmp (multiplatform module: metadata + jvm +
#                     android + Apple klibs) + darwin JNI, JVM/native tests,
#                     JVM + native examples (headless via SDL dummy driver)
#   Linux x64      -> linux JNI (x86_64 + aarch64 cross), JVM + native tests,
#                     linuxX64 example, mingwX64 klib with embedded lib
#   Windows x64    -> windows JNI (MinGW), JVM tests, mingwX64 klib
#   Android        -> publish android AAR + metadata to Maven Local, android
#                     host tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :imgui-kmp:publishToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :imgui-kmp:jvmTest

      - name: Run native tests
        run: ./gradlew --no-daemon :imgui-kmp:macosArm64Test

      - name: Run JVM renderer example (headless)
        run: >
          SDL_VIDEO_DRIVER=dummy
          ./gradlew --no-daemon :examples:jvmRun
          --args="--renderer --frames 120"

      - name: Run native renderer example (headless)
        run: >
          SDL_VIDEO_DRIVER=dummy IMGUI_KMP_FRAMES=120
          ./examples/build/bin/macosArm64/debugExecutable/examples.kexe

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :imgui-kmp:publishToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :imgui-kmp:jvmTest

      - name: Run native tests (linuxX64)
        run: ./gradlew --no-daemon :imgui-kmp:linuxX64Test

      - name: Run JVM renderer example (headless)
        run: >
          SDL_VIDEO_DRIVER=dummy
          ./gradlew --no-daemon :examples:jvmRun
          --args="--renderer --frames 120"

      - name: Run native renderer example (linuxX64, headless)
        run: >
          SDL_VIDEO_DRIVER=dummy IMGUI_KMP_FRAMES=120
          ./examples/build/bin/linuxX64/debugExecutable/examples.kexe

      - name: Compile mingwX64 klib with embedded static library
        # Cross-compiles libimgui.a with x86_64-w64-mingw32 and embeds it
        # into the mingwX64 cinterop klib (same as the publish-linux job).
        run: ./gradlew --no-daemon :imgui-kmp:compileKotlinMingwX64

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length
          Format-Hex -Path "$env:RUNNER_TEMP\signing-key.gpg" -Count 16

      - name: Publish all platforms to Maven Local
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :imgui-kmp:publishToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :imgui-kmp:jvmTest

      - name: Upload JVM crash log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hs_err-windows
          path: "**/hs_err_pid*.log"
          if-no-files-found: ignore

      - name: Compile native klib (mingwX64)
        # The mingwX64 klib ships bindings only (the static library is built
        # on the matching host), so only the klib compile is validated here.
        run: ./gradlew --no-daemon :imgui-kmp:compileKotlinMingwX64

  test-android:
    name: Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish android AAR + metadata to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :imgui-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :imgui-kmp:publishAndroidPublicationToMavenLocal

      - name: Run Android host tests (JVM)
        run: ./gradlew --no-daemon :imgui-kmp:testAndroidHostTest
